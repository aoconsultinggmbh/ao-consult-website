# ---------------------------------------------------------------------------
# Livegang: Webseite auf den echten Server hochladen (deutscher Hoster)
#
# Was passiert hier: Dieser Ablauf reagiert NUR auf den Zweig "live".
# Änderungen landen zuerst auf "main" (= Vorschau). Erst wenn jemand die
# Änderung freigibt ("main" nach "live" übernehmen), lädt GitHub die Dateien
# per verschlüsseltem FTP (FTPS) auf den echten Webserver.
# Nur Dateien, die sich geändert haben, werden übertragen.
#
# Freigabe durch Claude: "Gib die Änderungen bei Puchmayr frei" -> Claude
# übernimmt main nach live. Von Hand: Reiter "Pull requests" -> New ->
# base: live, compare: main -> Merge.
#
# Damit das läuft, müssen im Projekt drei "Secrets" hinterlegt sein
# (GitHub → Settings → Secrets and variables → Actions → New repository secret):
#
#   FTP_SERVER     z. B.  w01a2b3c.kasserver.com   (All-Inkl)  oder  www123.your-server.de (Hetzner)
#   FTP_BENUTZER   der FTP-Benutzername vom Hoster
#   FTP_PASSWORT   das dazugehörige Passwort
#   FTP_ORDNER     Zielordner auf dem Server, z. B.  /www.ao-consult.de/   oder  /public_html/
#
# Solange die Secrets fehlen, macht dieser Ablauf nichts und meldet das nur.
#
# Achtung (gemessen 06.10.2026): Wird der Zweig "live" NEU angelegt, startet
# dieser Ablauf nicht, weil GitHub beim ersten Anlegen keine geaenderten
# Dateien sieht. Dann einmal "Run workflow" auf live klicken oder eine echte
# Aenderung nachschieben. Danach laeuft jeder Push auf live automatisch.
# Anleitung in leichter Sprache: doku/livegang-anleitung.md
# ---------------------------------------------------------------------------
name: Livegang (Upload zum Hoster)

on:
  push:
    branches: [live]
    paths:
      - "website/**"
      - ".github/workflows/livegang.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: livegang
  cancel-in-progress: false

jobs:
  hochladen:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Pruefen, ob der Hoster schon eingerichtet ist
        id: pruefen
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::notice::Noch kein Hoster hinterlegt (Secret FTP_SERVER fehlt). Upload wird uebersprungen. Siehe doku/livegang-anleitung.md"
            echo "bereit=nein" >> "$GITHUB_OUTPUT"
          else
            echo "bereit=ja" >> "$GITHUB_OUTPUT"
          fi

      - name: Dateien holen
        if: steps.pruefen.outputs.bereit == 'ja'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Jede Datei bekommt das Datum ihrer letzten Aenderung im Projekt.
      # Ohne diesen Schritt tragen alle Dateien das Datum des Auscheckens,
      # und lftp haelt jedes Mal ALLE Dateien fuer geaendert und laedt die
      # komplette Seite neu hoch (gemessen 07.10.2026: ein halb hochgeladenes
      # Teambild war minutenlang kaputt zu sehen). Mit echten Zeitstempeln
      # gehen nur die Dateien ueber die Leitung, die sich wirklich geaendert haben.
      - name: Zeitstempel aus der Projekt-Historie setzen
        if: steps.pruefen.outputs.bereit == 'ja'
        run: |
          anzahl=0
          while IFS= read -r -d '' f; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ -n "$t" ]; then touch -d "@$t" "$f"; anzahl=$((anzahl+1)); fi
          done < <(git ls-files -z website)
          echo "Zeitstempel gesetzt fuer $anzahl Dateien."

      # Schluessel fuer Close und Brevo (Magazin-Formular) aus den GitHub-Secrets
      # CLOSE_API_KEY und BREVO_API_KEY in eine PHP-Datei schreiben, die nur auf
      # dem Server liegt. Sie steht nie im Projekt (das Projekt ist oeffentlich)
      # und ist von aussen gesperrt (.htaccess). Fehlt ein Secret, bleibt der
      # Wert leer und magazin.php meldet dem Team, was von Hand zu tun ist.
      - name: Schluessel fuer Close und Brevo bereitlegen
        if: steps.pruefen.outputs.bereit == 'ja'
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
        run: |
          mkdir -p website/_konfig
          php -r 'file_put_contents("website/_konfig/schluessel.php", "<?php\n// Automatisch beim Livegang erzeugt. Nicht von Hand aendern.\nreturn " . var_export(["close" => (string)getenv("CLOSE_API_KEY"), "brevo" => (string)getenv("BREVO_API_KEY")], true) . ";\n");'
          printf 'Require all denied\n' > website/_konfig/.htaccess
          echo "Close: $([ -n "$CLOSE_API_KEY" ] && echo hinterlegt || echo fehlt) · Brevo: $([ -n "$BREVO_API_KEY" ] && echo hinterlegt || echo fehlt)"

      - name: Upload-Werkzeug installieren (lftp)
        if: steps.pruefen.outputs.bereit == 'ja'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      # Hochladen mit lftp statt mit einem fertigen GitHub-Baustein.
      #
      # Grund (erprobt beim Livegang Kiefer am 21.09.2026):
      # Der Baustein SamKirkland/FTP-Deploy-Action bricht bei All-Inkl mit
      # "Client is closed because read ECONNRESET (data socket)" ab. lftp kommt
      # mit deren FTPS zurecht, weil es die TLS-Sitzung der Steuerverbindung
      # auf der Datenverbindung wiederverwendet - genau das verlangt der Server.
      #
      # Wichtige Einstellungen und warum:
      #   ssl-force / ssl-protect-data  Anmeldung UND Dateien verschluesselt
      #   passive-mode true             der Runner steht hinter einer Firewall
      #   prefer-epsv false             All-Inkl antwortet auf EPSV unzuverlaessig
      #   cmd:fail-exit true            ein Fehler laesst den Ablauf rot werden,
      #                                 statt faelschlich "erfolgreich" zu melden
      #   open + user (zwei Zeilen)     vertraegt Passwoerter mit Komma oder @,
      #                                 anders als "open -u benutzer,passwort"
      #   xfer:use-temp-file true       jede Datei wird erst als "name.hochladen"
      #                                 uebertragen und dann umbenannt. Besucher
      #                                 sehen so nie eine halb hochgeladene Datei
      #                                 (kaputtes Bild), sondern immer die alte
      #                                 oder die fertige neue.
      #
      # --delete raeumt Dateien weg, die es im Projekt nicht mehr gibt.
      # Das ist gewollt: im Zielordner liegt ausschliesslich diese Webseite.
      - name: Auf den Server hochladen (FTPS, verschluesselt)
        if: steps.pruefen.outputs.bereit == 'ja'
        env:
          SERVER: ${{ secrets.FTP_SERVER }}
          BENUTZER: ${{ secrets.FTP_BENUTZER }}
          PASSWORT: ${{ secrets.FTP_PASSWORT }}
          ORDNER: ${{ secrets.FTP_ORDNER }}
        run: |
          lftp <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ftp:passive-mode true
          set ftp:prefer-epsv false
          set net:max-retries 3
          set net:timeout 25
          set net:reconnect-interval-base 5
          set xfer:clobber on
          set xfer:use-temp-file true
          set xfer:temp-file-name *.hochladen
          set cmd:fail-exit true
          open "$SERVER"
          user "$BENUTZER" "$PASSWORT"
          mirror --reverse --delete --verbose=1 --parallel=2 --exclude-glob .DS_Store --exclude-glob _alte-dateinamen/ ./website/ "${ORDNER:-./}"
          bye
          LFTP
          echo "Upload abgeschlossen."
